# gitleaks configuration for VNUTour.
#
# The infra manifests and local dev compose files allowlisted below hold ONLY
# placeholder / development-only credentials. Real production secrets are
# injected at runtime from the cluster Secret (see k8s/kustomize) and the
# process environment — they never live in git. Because gitleaks scans the full
# history, these paths are allowlisted so the secret-scan gate stays meaningful:
# it still fails on anything committed OUTSIDE these known placeholder files.
#
# If a real secret ever needs to live in one of these files, rotate it and
# narrow this allowlist instead of widening it.

[extend]
useDefault = true

[allowlist]
description = "Placeholder/dev-only credentials in infra manifests and local dev compose files"
paths = [
    '''k8s/.*secret.*\.ya?ml''',
    '''backend/docker-compose\.yml''',
    '''backend/docker-compose\.dev\.yml''',
]
regexes = [
    # Django dev fallback SECRET_KEY (settings.py, used only when DEBUG).
    '''dev-secret-key-change-me''',
]
