version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vnutour-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vnutour
      POSTGRES_PASSWORD: vnutour
      POSTGRES_DB: vnutour
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    container_name: vnutour-bot
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - FFMPEG_EXE=ffmpeg
      - SHEET_CACHE_FILE=/data/sheet_snapshot.json
    volumes:
      - ./data:/data

  web:
    build: .
    container_name: vnutour-web
    restart: unless-stopped
    command: python webapi/manage.py runserver 0.0.0.0:8080
    env_file:
      - .env.docker
    environment:
      - DJANGO_DEBUG=1
      - DB_HOST=postgres
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - bot

  email-worker:
    build: .
    container_name: vnutour-email-worker
    restart: unless-stopped
    command: python webapi/manage.py process_email_queue --watch --sleep 5
    env_file:
      - .env.docker
    environment:
      - DB_HOST=postgres
    volumes:
      - .:/app
    depends_on:
      - postgres
      - web

volumes:
  pgdata:
