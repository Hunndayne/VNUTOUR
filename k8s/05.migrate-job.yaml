apiVersion: batch/v1
kind: Job
metadata:
  name: vnutour-migrate
  namespace: vnutour
spec:
  backoffLimit: 10

  # The wait-for-postgres loop below has no timeout of its own, and OnFailure
  # never gives up, so without a deadline a database that never comes up leaves
  # this Job pending forever and the deploy silently hangs instead of failing.
  activeDeadlineSeconds: 600

  # A Job's pod template is immutable, so re-applying this file with a new image
  # tag is rejected while the old Job still exists. Letting it delete itself an
  # hour after it finishes means routine deploys just work; a redeploy inside
  # that hour still needs `kubectl delete job vnutour-migrate` first.
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app: vnutour-migrate

    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine

          env:
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_NAME

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER

          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done

      containers:
        - name: migrate
          image: ghcr.io/hunndayne/vnutour-backend:308a7a1

          # Run migrations, then seed the four fixed program phases. seed_phases
          # uses update_or_create so it is idempotent and safe to re-run on every
          # deploy; without it a fresh database has no phases and the admin pages
          # 404 on /api/program/phases/registration. set -e so the Job fails if
          # migrate fails instead of seeding against a half-migrated schema.
          command:
            - sh
            - -c
            - |
              set -e
              python webapi/manage.py migrate --noinput
              python webapi/manage.py seed_phases

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret