# Placeholder values only. Every key here is read straight from the environment
# by webapi/serverapi/settings.py and src/bot/config.py, so the names have to
# match those files exactly — a wrong name fails silently at best and crashes
# the pod at worst.
#
# Do not commit real values. Create the secret from a file kept outside the
# repository instead:
#
#   kubectl -n vnutour create secret generic backend-secret \
#     --from-env-file=/srv/vnutour/.env.docker
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: vnutour
type: Opaque
stringData:
  DB_NAME: "vnutour"
  DB_USER: "vnutour"
  DB_PASSWORD: "replace-with-a-long-random-password"

  # settings.py raises at import time when this is empty in production, which
  # takes down the API, the bot, the email worker and the migration job alike.
  DJANGO_SECRET_KEY: "replace-with-a-long-random-secret"

  # Discord bot. The bot pod starts and then fails to log in without a token.
  # The backend also uses DISCORD_TOKEN + DISCORD_GUILD_ID to check whether a
  # participant who linked via the web is actually in the guild.
  # DISCORD_TOKEN: ""
  # DISCORD_GUILD_ID: ""
  # TEAM_CATEGORY_IDS: ""

  # Discord "Connect" OAuth2 client secret (public CLIENT_ID + redirect URIs are
  # in backend-config). Needed by the backend to exchange the OAuth code.
  # DISCORD_CLIENT_SECRET: ""

  # Public Google OAuth client ID. Also has to be passed as a build argument to
  # the frontend image, because Vite bakes it in at build time — setting it here
  # alone does nothing for the browser.
  # GOOGLE_CLIENT_ID: ""

  # SMTP, read by settings.py as SMTP_* rather than Django's own EMAIL_* names.
  # SMTP_HOST: "smtp.gmail.com"
  # SMTP_PORT: "587"
  # SMTP_USE_TLS: "1"
  # SMTP_USER: ""
  # SMTP_PASSWORD: ""
  # SMTP_FROM: "noreply@example.com"

  # Cloudflare R2. Uploads fall back to the media volume when unset.
  # R2_ACCOUNT_ID: ""
  # R2_ACCESS_KEY_ID: ""
  # R2_SECRET_ACCESS_KEY: ""
  # R2_BUCKET: ""
  # R2_PUBLIC_BASE_URL: ""
