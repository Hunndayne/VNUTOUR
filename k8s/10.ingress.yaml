# Everything enters through the frontend pod, not through separate rules per
# service: its Nginx already proxies /api/ and /media/ to the backend and serves
# the React bundle for everything else. Splitting the routing across the Ingress
# as well would mean two places to keep in sync.
#
# Requires ingress-nginx. A stock k3s installs Traefik instead and will simply
# ignore this object — see README.md in this directory.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vnutour
  namespace: vnutour
  annotations:
    # Matches client_max_body_size in frontend/nginx.conf. Backup restores and
    # station submissions carry large files, and the smaller of the two limits
    # is the one that applies.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

    # Cloudflare is in front (proxied DNS) with SSL/TLS mode "Full (strict)": it
    # reaches this origin over HTTPS on 443 and validates the certificate in the
    # vnutour-tls secret, which holds a Cloudflare Origin Certificate. ssl-redirect
    # stays off: Cloudflare's "Always Use HTTPS" already forces https at the edge,
    # and forcing it again at the origin would loop while any request still
    # arrives over http. use-forwarded-headers=true on the controller keeps the
    # X-Forwarded-Proto: https that Cloudflare sends, so Django sees the request
    # as secure (see README).
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx

  # TLS to the origin. The secret is a Cloudflare Origin Certificate, loaded with
  #   kubectl -n vnutour create secret tls vnutour-tls \
  #     --cert=origin.pem --key=origin.key
  tls:
    - hosts:
        - vnutour.suctremmt.com
      secretName: vnutour-tls

  # The hostname must also appear in DJANGO_ALLOWED_HOSTS in 01.configmap.yaml
  # or Django rejects the forwarded Host header with a 400.
  rules:
    - host: vnutour.suctremmt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
