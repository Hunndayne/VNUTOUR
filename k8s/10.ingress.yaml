# Everything enters through the frontend pod, not through separate rules per
# service: its Nginx already proxies /api/ and /media/ to the backend and serves
# the React bundle for everything else. Splitting the routing across the Ingress
# as well would mean two places to keep in sync.
#
# Requires ingress-nginx. A stock k3s installs Traefik instead and will simply
# ignore this object — see README.md in this directory.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vnutour
  namespace: vnutour
  annotations:
    # Matches client_max_body_size in frontend/nginx.conf. Backup restores and
    # station submissions carry large files, and the smaller of the two limits
    # is the one that applies.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

    # cert-manager watches this and issues the certificate named in tls below.
    # The issuer solves the ACME challenge over port 80, so the router has to
    # keep forwarding it even though the site itself redirects to HTTPS.
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: nginx

  # TLS terminates here, on the cluster edge. cert-manager fills this secret in
  # after the first successful ACME challenge; until then ingress-nginx answers
  # with its own self-signed certificate, so a browser warning on day one means
  # the challenge has not completed rather than that something is broken.
  tls:
    - hosts:
        - vnutour.hunn.io.vn
        - vnutour.suctremmt.com
      secretName: vnutour-tls

  # Both hostnames must also appear in DJANGO_ALLOWED_HOSTS in 01.configmap.yaml
  # or Django rejects the forwarded Host header with a 400.
  rules:
    - host: vnutour.hunn.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    - host: vnutour.suctremmt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
