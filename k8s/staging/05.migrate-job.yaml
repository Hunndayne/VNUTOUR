# Staging migrate + seed. The deploy-staging workflow rewrites the image tag
# before applying, same as prod.
apiVersion: batch/v1
kind: Job
metadata:
  name: vnutour-migrate
  namespace: vnutour-staging
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app: vnutour-migrate

    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine

          env:
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_NAME

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER

          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done

      containers:
        - name: migrate
          image: ghcr.io/hunndayne/vnutour-backend:staging

          command:
            - sh
            - -c
            - |
              set -e
              python webapi/manage.py migrate --noinput
              python webapi/manage.py seed_phases

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
