# Placeholder only — DO NOT commit real values. Create on the cluster from a file
# kept outside the repo:
#
#   kubectl -n vnutour-staging create secret generic backend-secret \
#     --from-env-file=/srv/vnutour/.env.staging \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Store REDIS_PASSWORD in that same root-owned env file as the PostgreSQL
# credentials. Generate it with `openssl rand -hex 32`, keep the file mode at
# 0600, and never paste the real value into this manifest or a shell command.
#
# Keep staging fully isolated from prod: a different DB password and a different
# DJANGO_SECRET_KEY from the vnutour namespace. Discord/SMTP keys are omitted —
# the bot and email worker are not deployed to staging.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: vnutour-staging
type: Opaque
stringData:
  DB_NAME: "vnutour_staging"
  DB_USER: "vnutour_staging"
  DB_PASSWORD: "replace-with-a-long-random-password"

  # Exactly 64 hexadecimal characters; use a different value in every environment.
  REDIS_PASSWORD: "replace-with-64-random-hex-characters"

  DJANGO_SECRET_KEY: "replace-with-a-long-random-secret"

  # Optional — a separate R2 bucket/prefix if staging needs object storage.
  # Left unset, uploads fall back to the media volume.
  # R2_ACCOUNT_ID: ""
  # Optional override; account endpoint only, never append /<bucket>.
  # R2_ENDPOINT_URL: "https://<account-id>.r2.cloudflarestorage.com"
  # R2_ACCESS_KEY_ID: ""
  # R2_SECRET_ACCESS_KEY: ""
  # R2_BUCKET: ""
  # R2_PUBLIC_BASE_URL: "https://storage-vnutour-staging.example.com"
