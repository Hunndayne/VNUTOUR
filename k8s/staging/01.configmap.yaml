# Staging config — mirrors k8s/01.configmap.yaml but scoped to vnutour-staging and
# the staging.vnutour.hunn.io.vn host. Discord fields are intentionally blank: the bot is
# not deployed to staging.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: vnutour-staging
data:
  DJANGO_ENV: "production"
  DJANGO_DEBUG: "0"

  # Only the staging host (plus loopback for kubelet probes). Keep in sync with
  # 10.ingress.yaml in this directory.
  DJANGO_ALLOWED_HOSTS: "staging.vnutour.hunn.io.vn,localhost,127.0.0.1"

  TRUST_PROXY_HEADERS: "1"

  DB_HOST: "postgres"
  DB_PORT: "5432"

  FFMPEG_EXE: "ffmpeg"

  # Links the app builds point back at staging.
  WEB_BASE_URL: "https://staging.vnutour.hunn.io.vn"

  # No Discord bot on staging.
  DISCORD_CLIENT_ID: ""
  DISCORD_OAUTH_REDIRECT_URIS: ""
  DISCORD_INVITE_URL: ""
