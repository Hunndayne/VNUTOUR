# No storageClassName anywhere in this file: k3s ships local-path as the default
# class, and naming it explicitly would break the manifests on any other
# cluster. Note that local-path volumes are node-local — a pod that mounts one
# can only ever be scheduled on the node holding it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: vnutour
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: vnutour
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: vnutour
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
