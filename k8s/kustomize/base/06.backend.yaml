# Staging backend - trimmed vs prod: no backup volume (staging is disposable)
# and no prometheus annotations (staging has no monitoring stack)
# Image tag is managed by Kustomize overlay - do NOT hardcode here
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: vnutour-staging
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vnutour-staging
spec:
  replicas: 1

  # Recreate: this pod mounts a ReadWriteOnce local-path volume (media-data).
  # Surging a second pod means the scheduler may place it on a different node
  # where the volume is unavailable — Recreate avoids that wedge.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      terminationGracePeriodSeconds: 30

      # media-data is a local-path claim, so pin to the storage node.
      nodeSelector:
        vnutour/storage: "true"

      containers:
        - name: backend
          image: ghcr.io/hunndayne/vnutour-backend
          # Tag is injected by Kustomize overlay.

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Scaled down from prod — staging carries a tester or two.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: media
              mountPath: /app/webapi/media

      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data
