# Staging entrypoint — same shape as k8s/10.ingress.yaml but scoped to
# vnutour-staging namespace and a single host (vnutour.hunn.io.vn).
# Everything enters through the frontend pod: its Nginx already proxies
# /api/ and /media/ to the backend and serves the React bundle for everything else.
#
# Requires ingress-nginx (same as prod).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vnutour
  namespace: vnutour-staging
  annotations:
    # Matches client_max_body_size in frontend/nginx.conf.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

    # Cloudflare is in front (proxied DNS) with SSL/TLS mode "Full (strict)":
    # it reaches this origin over HTTPS on 443 and validates the certificate
    # in the vnutour-tls secret. ssl-redirect stays off to avoid redirect loops.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx

  # TLS to the origin. The secret holds the same Cloudflare Origin Certificate
  # as prod (its SANs cover this host), copied across namespaces because
  # secrets are namespace-scoped:
  #   kubectl -n vnutour get secret vnutour-tls -o yaml \
  #     | sed 's/namespace: vnutour/namespace: vnutour-staging/' | kubectl apply -f -
  # Not managed by ArgoCD (created out-of-band, same as backend-secret).
  tls:
    - hosts:
        - vnutour.hunn.io.vn
      secretName: vnutour-tls

  rules:
    - host: vnutour.hunn.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
