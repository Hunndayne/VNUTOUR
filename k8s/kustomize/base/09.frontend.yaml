# Staging frontend — single replica, no nginx-exporter sidecar and no
# prometheus annotations (staging has no monitoring stack).
# Image tag is managed by Kustomize overlay — do NOT hardcode here.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vnutour-staging
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vnutour-staging
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/hunndayne/vnutour-frontend
          # Tag is injected by Kustomize overlay.

          ports:
            - name: http
              containerPort: 80

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
