# Staging config - mirrors k8s/01.configmap.yaml but scoped to vnutour-staging and
# the vnutour.hunn.io.vn host. Discord fields are intentionally blank: the bot is
# not deployed to staging.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: vnutour-staging
data:
  DJANGO_ENV: "production"
  DJANGO_DEBUG: "0"

  # Only the staging host plus loopback for kubelet probes
  DJANGO_ALLOWED_HOSTS: "vnutour.hunn.io.vn,localhost,127.0.0.1"

  TRUST_PROXY_HEADERS: "1"

  DB_HOST: "postgres"
  DB_PORT: "5432"

  # Shared cache for rate-limit counters and disposable response caches.
  # REDIS_PASSWORD is required and loaded separately from backend-secret.
  REDIS_HOST: "redis"
  REDIS_TCP_PORT: "6379"
  REDIS_DB: "0"
  REDIS_CONNECT_TIMEOUT_SECONDS: "0.5"
  REDIS_TIMEOUT_SECONDS: "0.5"
  READ_MOSTLY_CACHE_ENABLED: "1"
  SITE_CONFIG_CACHE_TTL_SECONDS: "30"
  PROGRAM_CACHE_TTL_SECONDS: "300"
  STATION_CONFIG_CACHE_TTL_SECONDS: "300"
  READ_MOSTLY_CACHE_TTL_JITTER_PERCENT: "10"
  READ_MOSTLY_CACHE_LOCK_SECONDS: "5"
  READ_MOSTLY_CACHE_LOCK_WAIT_SECONDS: "0.1"

  FFMPEG_EXE: "ffmpeg"

  # Links the app builds point back at staging.
  WEB_BASE_URL: "https://vnutour.hunn.io.vn"

  # No Discord bot on staging.
  DISCORD_CLIENT_ID: ""
  DISCORD_OAUTH_REDIRECT_URIS: ""
  DISCORD_INVITE_URL: ""
