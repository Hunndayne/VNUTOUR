# Template only. This file is deliberately excluded from kustomization.yaml.
# Create the real secret out-of-band; never commit service-account JSON or the
# shared token:
#
#   kubectl -n <namespace> create secret generic photo-ai-secret \
#     --from-literal=PHOTO_AI_TOKEN='...' \
#     --from-literal=PHOTO_DB_PASSWORD='...' \
#     --from-file=credentials.json=/secure/path/photo-drive-service-account.json
#
apiVersion: v1
kind: Secret
metadata:
  name: photo-ai-secret
type: Opaque
stringData:
  PHOTO_AI_TOKEN: replace-with-the-shared-random-token
  PHOTO_DB_PASSWORD: replace-with-the-gallery-database-password
  credentials.json: replace-with-real-service-account-json
