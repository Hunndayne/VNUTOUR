apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-ai-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: photo-ai-worker
  template:
    metadata:
      labels:
        app: photo-ai-worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: photo-ai-worker
          image: ghcr.io/hunndayne/vnutour-photo-ai
          imagePullPolicy: IfNotPresent
          command:
            - python
            - webapi/manage.py
            - process_event_photos
          envFrom:
            - configMapRef:
                name: backend-config
            - configMapRef:
                name: photo-ai-config
            - secretRef:
                name: backend-secret
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: serverapi.settings
            - name: PHOTO_GALLERY_ENABLED
              value: "1"
            - name: PHOTO_DRIVE_CREDENTIALS
              value: /var/run/photo-ai/credentials.json
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "3"
              memory: 2Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: drive-credentials
              mountPath: /var/run/photo-ai
              readOnly: true
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: drive-credentials
          secret:
            secretName: photo-ai-secret
            items:
              - key: credentials.json
                path: credentials.json
            defaultMode: 0440
