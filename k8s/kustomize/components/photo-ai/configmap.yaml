apiVersion: v1
kind: ConfigMap
metadata:
  name: photo-ai-config
data:
  PHOTO_AI_URL: "http://photo-ai:8000"
  PHOTO_AI_MODEL_DIR: "/models"
  PHOTO_AI_THREADS: "2"
  PHOTO_SEARCH_ENABLED: "0"
  PHOTO_SEARCH_THRESHOLD: "0.50"
  # Empty reuses R2_BUCKET from backend-secret; photo keys use event-photos/.
  # Set only when overriding the shared bucket for both backend and worker.
  PHOTO_R2_BUCKET: ""
