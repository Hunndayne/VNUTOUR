apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Shared PROD app-tier configuration, applied on top of ../../base by BOTH the
# homelab (overlays/prod) and the Linode standby (overlays/prod-standby). Keeping
# it in one component guarantees the two zones run byte-identical app config, so
# the only thing that can differ between them is what each overlay adds on top
# (e.g. homelab later adds bot/email/monitoring/backup — the standby never does).
#
# The base carries staging defaults (hunn.io.vn, small resources); everything
# here retargets it at the prod host and prod sizing.
patches:
  # --- Prod host / URLs ------------------------------------------------------
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: vnutour.suctremmt.com,localhost,127.0.0.1
      - op: replace
        path: /data/WEB_BASE_URL
        value: https://vnutour.suctremmt.com
      - op: replace
        path: /data/DISCORD_OAUTH_REDIRECT_URIS
        value: https://vnutour.suctremmt.com/participant

  - target:
      kind: Ingress
      name: vnutour
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: vnutour.suctremmt.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: vnutour.suctremmt.com

  # --- Prod resource sizing (backend) ---------------------------------------
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi

  # --- Prod frontend: 2 replicas --------------------------------------------
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # --- Data-safety: never let ArgoCD prune the database / media volumes ------
  # If one of these ever falls out of Git (rename, refactor) ArgoCD with
  # prune enabled would delete the PVC and take the data with it. Opt them out.
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false
  - target:
      kind: PersistentVolumeClaim
      name: media-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false
