# The site-activator scales the singleton workloads (bot, email-worker) in its
# own namespace based on whether this cluster holds the DB leader, and — on the
# homelab side — triggers an auto-failback by running patronictl in the local
# Patroni pod. So it needs to read/scale Deployments and exec into that pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: site-activator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: site-activator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  # Auto-failback: exec `patronictl switchover` in the local Patroni pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: site-activator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: site-activator
subjects:
  - kind: ServiceAccount
    name: site-activator
