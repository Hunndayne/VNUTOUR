# Component: bot + email-worker Deployments baselined at replicas: 0, for use
# with components/site-failover. The site-activator scales these to 1 on
# whichever site holds the DB leader. Only include this component in an
# overlay that also includes components/site-failover -- without the
# activator running, these workloads would sit permanently at 0.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - bot.yaml
  - email-worker.yaml
