apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Single-node Postgres engine. Included ONLY by overlays/staging.
#
# Prod (overlays/prod) and the Linode standby (overlays/prod-standby) do NOT
# include this — their database is an external Patroni + etcd HA cluster that is
# deliberately kept out of the app-tier GitOps so ArgoCD selfHeal never fights a
# failover or a manual DB operation (see the DB HA runbook, Phase 0.5). Until the
# Patroni engine ships (components/db-patroni), the live prod DB keeps running as
# the pre-existing, now-unmanaged `postgres` StatefulSet (protected by prune=false).
resources:
  - postgres.yaml
