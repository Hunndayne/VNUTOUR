apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD STANDBY — Zone 2 (Linode), namespace vnutour, warm copy of the app tier.
#
# Deliberately app-tier only: NO Discord bot, NO email-worker, NO backup CronJob.
# Those are cluster-wide singletons — running a second bot with the same token
# would open a duplicate gateway session and every slash command would fire
# twice. The standby exists to hold the SAME application version as Zone 1 (via
# the shared components/images) and to be promotable after a DB restore.
#
# It shares components/prod-config and components/images with overlays/prod, so
# the backend/frontend image tag here is always identical to Zone 1's.
#
# db-patroni here = the Linode REPLICA member of the vnutour-pg cluster. The
# inline patch flips the homelab-primary defaults to advertise the Linode mesh
# IP 10.88.0.2 and a distinct member name. It streams async from the homelab
# primary and is promotable on failover. Prereqs: etcd 3-site up, the Linode
# node labelled vnutour/storage=true, Secret patroni-secret present (identical
# to homelab). The patch is inline (not a file path) on purpose — kustomize's
# load-restrictor forbids a patch file outside the overlay dir.
namespace: vnutour

resources:
  - ../../base

components:
  - ../../components/prod-config
  - ../../components/images
  - ../../components/db-patroni

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-ha
      spec:
        template:
          spec:
            containers:
              - name: patroni
                env:
                  - name: PATRONI_NAME
                    value: linode
                  - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
                    value: "10.88.0.2:5432"
                  - name: PATRONI_RESTAPI_CONNECT_ADDRESS
                    value: "10.88.0.2:8008"
