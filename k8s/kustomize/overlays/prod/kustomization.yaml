apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD — Zone 1 (homelab), namespace vnutour, host vnutour.suctremmt.com.
#
# NOTE: renders the APP TIER + the Patroni HA database engine (db-patroni) as
# the HOMELAB PRIMARY member. The live homelab prod also runs the Discord bot,
# email-worker, monitoring (11-15) and the backup CronJob (16). Those are NOT
# here yet, so DO NOT point an auto-sync/prune ArgoCD Application at the homelab
# cluster from this overlay — it would prune those workloads. Port them into a
# homelab-only component first (see k8s/argocd/prod-app.yaml).
#
# db-patroni prerequisites (DB HA runbook): external 3-site etcd up, node
# vnutour-w1 labelled vnutour/storage=true, Secret patroni-secret present. The
# member advertises 192.168.1.111 (the db-patroni default = homelab primary).
namespace: vnutour

resources:
  - ../../base

components:
  - ../../components/prod-config
  - ../../components/backend-ops
  - ../../components/db-patroni
  - ../../components/failover-workloads
  - ../../components/site-failover
  # Event photo gallery (homelab only). prod-standby deliberately leaves it out:
  # photos-db is a single local-path pod, so during a failover to Linode the
  # backend there reports photo_gallery=false and the frontend hides the gallery
  # instead of showing a broken page. Needs the out-of-band photo-ai-secret
  # (present in both zones, identical) and R2 in backend-secret.
  - ../../components/photo-ai
  # Set image tags after all workloads are added, including bot and email-worker.
  - ../../components/images

# site-activator per-site knobs: this is the HOMELAB site, and the site that
# performs auto-failback. See components/site-failover/kustomization.yaml for
# the full prereqs (postgres-ha, Secret cf-dns-secret out-of-band).
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: site-activator
      spec:
        template:
          spec:
            containers:
              - name: site-activator
                env:
                  - name: SITE
                    value: "homelab"
                  - name: MEMBER_NAME
                    value: "vnutour-w1"
                  - name: DNS_TARGET_TYPE
                    value: "CNAME"
                  - name: DNS_TARGET_CONTENT
                    value: "vpn.hunn.io.vn"
                  - name: FAILBACK_STABILIZE
                    value: "300"

  # --- Photo gallery placement and switches ----------------------------------
  # vnutour-w1 carries the Patroni primary and is nearly fully requested, so the
  # whole gallery tier (database, worker and the search API, which bursts to
  # 2 CPUs per search) lives on vnutour-w2. photos-db binds its local-path volume to
  # the node it first lands on, which is why it is pinned by hostname.
  - target:
      kind: StatefulSet
      name: photos-db
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: vnutour-w2
  # Prod stores derivatives in R2, so the worker does not need media-data. That
  # claim is bound to w1 (backend-ops); mounting it would pin the worker there.
  # The test ops make the build fail loudly if the component's volume order
  # ever changes, instead of silently removing the wrong volume.
  - target:
      kind: Deployment
      name: photo-ai-worker
    patch: |-
      - op: test
        path: /spec/template/spec/volumes/1/name
        value: media
      - op: remove
        path: /spec/template/spec/volumes/1
      - op: test
        path: /spec/template/spec/containers/0/volumeMounts/2/name
        value: media
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/2
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: vnutour-w2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
            ephemeral-storage: 1Gi
  - target:
      kind: Deployment
      name: photo-ai
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: vnutour-w2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 384Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: "2"
            memory: 1536Mi
            ephemeral-storage: 1Gi
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/PHOTO_SEARCH_ENABLED
        value: "1"
      - op: add
        path: /data/PHOTO_DRIVE_SERVICE_EMAIL
        value: vnutour@dotted-guru-459523-v9.iam.gserviceaccount.com
  - target:
      kind: ConfigMap
      name: photo-ai-config
    patch: |-
      - op: replace
        path: /data/PHOTO_SEARCH_ENABLED
        value: "1"
