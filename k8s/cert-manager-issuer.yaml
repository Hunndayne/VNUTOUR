# Shared ClusterIssuers for services on the same cluster (ArgoCD, future Grafana).
# Render acme@example.invalid from ACME_EMAIL before applying; the ArgoCD bootstrap pipeline does this after cert-manager is installed on the VPS.
# Staging is for ACME troubleshooting only; its certificates are not trusted by browsers. Production Certificates reference letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: acme@example.invalid
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      # Public port 80 must reach the solver for issuance AND renewal.
      - http01:
          ingress:
            ingressClassName: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: acme@example.invalid
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
