apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vnutour-staging
  namespace: argocd
  # Finalizer ensures ArgoCD cleans up cluster resources when this Application
  # is deleted from Git (cascade delete)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Hunndayne/VNUTOUR.git
    targetRevision: staging          
    path: k8s/kustomize/overlays/staging

  # Staging runs on the Zone 1 homelab cluster (hunn.io.vn), while this ArgoCD
  # lives on Zone 2 (Linode). So the destination is the homelab cluster over the
  # wg mesh, NOT in-cluster. Register it first: argocd cluster add zone1
  # --name zone1-homelab (see wg runbook §10); the server URL must match.
  destination:
    server: https://192.168.1.110:6443
    namespace: vnutour-staging

  syncPolicy:
    automated:
      prune: true       # remove resources that no longer exist in Git
      selfHeal: true    # re-apply if someone makes an out-of-band kubectl change
    syncOptions:
      - CreateNamespace=true   # create vnutour-staging if it doesn't exist
      - ServerSideApply=true   # avoids annotation size limits on large manifests
