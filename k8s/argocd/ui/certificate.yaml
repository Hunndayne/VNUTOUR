apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-ui-tls
  namespace: argocd
spec:
  secretName: argocd-ui-tls
  dnsNames:
    - argocd.example.invalid # Replaced on the Actions runner; never apply directly.
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always
