# =============================================================================
# Zone 1 (homelab) prod Application — DO NOT SYNC YET.
#
# WireGuard mesh is UP: ArgoCD on Zone 2 reaches the homelab API at
# 192.168.1.110:6443 (destination.server below). Register it once with:
#   argocd cluster add zone1 --name zone1-homelab   # see wg runbook §10
#
# STILL OPEN before a first sync is safe — pick one:
#
#   (A) Port the FULL homelab stack (Discord bot, email-worker, monitoring
#       11-15, backup CronJob 16) into a homelab-only component added to
#       overlays/prod, so ArgoCD is authoritative for everything. Then prune is
#       safe. Most complete; more work.
#
#   (B) Adopt app-tier only with prune DISABLED (remove/omit automated.prune):
#       ArgoCD manages backend/frontend/postgres/ingress and leaves the
#       imperative bot/email/monitoring/backup untouched. Faster path to
#       version parity. REQUIRED SAFEGUARD: pin components/images to the CURRENT
#       live prod SHA first, or the first sync rolls prod to whatever tag is in
#       git (currently `latest`).
#
# Kept manual (no automated block) on purpose: the first homelab sync must be a
# deliberate, reviewed `argocd app sync`. PVCs/StatefulSet also carry
# Prune=false (components/prod-config) as a second line of defence.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vnutour-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Hunndayne/VNUTOUR.git
    targetRevision: main
    path: k8s/kustomize/overlays/prod

  destination:
    server: https://192.168.1.110:6443   # homelab k3s API over the wg mesh (must be `argocd cluster add`-ed first)
    namespace: vnutour

  # No `automated:` block — sync manually until the full stack is in the overlay
  # and the first cutover has been verified. PVCs/StatefulSet already carry
  # Prune=false (components/prod-config) as a second line of defence.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
