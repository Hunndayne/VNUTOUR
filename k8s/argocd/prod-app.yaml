# =============================================================================
# Zone 1 (homelab) prod Application — DO NOT APPLY YET.
#
# Two prerequisites are still open before this is safe to sync:
#
#   1. WireGuard up + homelab cluster registered in this ArgoCD:
#        argocd cluster add <homelab-context>   # over the WG link to :6443
#      Then set spec.destination.server below to the URL that
#        argocd cluster list
#      prints for the homelab cluster (replace the REPLACE_ME placeholder).
#
#   2. overlays/prod must render the FULL homelab stack (Discord bot,
#      email-worker, monitoring 11-15, backup CronJob 16) BEFORE this syncs.
#      Right now overlays/prod is app-tier only; syncing it at the homelab with
#      prune on would DELETE those live workloads. Port them into a
#      homelab-only kustomize component and add it to overlays/prod first.
#
# Kept manual (no automated block) on purpose: the first homelab sync should be
# a deliberate, reviewed `argocd app sync`, not a push-button auto-sync.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vnutour-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Hunndayne/VNUTOUR.git
    targetRevision: main
    path: k8s/kustomize/overlays/prod

  destination:
    server: REPLACE_ME   # homelab cluster URL from `argocd cluster list` (see header)
    namespace: vnutour

  # No `automated:` block — sync manually until the full stack is in the overlay
  # and the first cutover has been verified. PVCs/StatefulSet already carry
  # Prune=false (components/prod-config) as a second line of defence.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
