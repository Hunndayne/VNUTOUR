apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-grafana-tls
  namespace: monitoring
spec:
  secretName: monitoring-grafana-tls
  dnsNames:
    - grafana.example.invalid # Replaced after hostname validation; never apply directly.
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always

