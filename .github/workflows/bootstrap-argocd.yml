name: Bootstrap ArgoCD UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-argocd.yml"
      - "k8s/argocd/ui/*.sh"
      - "k8s/argocd/ui/*.yaml"
      - "k8s/cert-manager-issuer.yaml"

permissions:
  contents: read

concurrency:
  group: argocd-ui-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install runner tools and check scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2-utils jq shellcheck sshpass
          bash -n k8s/argocd/ui/deploy.sh k8s/argocd/ui/bootstrap.sh
          shellcheck k8s/argocd/ui/deploy.sh k8s/argocd/ui/bootstrap.sh

      - name: Setup SSH known_hosts
        env:
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Bootstrap over SSH and verify HTTPS authentication
        env:
          ARGOCD_HOSTNAME: ${{ secrets.ARGOCD_HOSTNAME || vars.ARGOCD_HOSTNAME }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || vars.ACME_EMAIL }}
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: bash k8s/argocd/ui/deploy.sh
