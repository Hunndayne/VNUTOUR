name: CI for DB image (Postgres + pgvector)

# Builds the staging Postgres image with pgvector. The tag is fixed by the
# Postgres major + pgvector version, and overlays pin it by hand: a database
# image must never move under a running volume just because CI ran.
on:
  push:
    branches: [staging]
    paths:
      - "docker/postgres-pgvector/**"
      - ".github/workflows/ci-db-image.yml"
  pull_request:
    paths:
      - "docker/postgres-pgvector/**"
      - ".github/workflows/ci-db-image.yml"
  workflow_dispatch:

concurrency:
  group: ci-db-image-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  IMAGE: ghcr.io/hunndayne/vnutour-postgres
  TAG: 16-alpine-pgvector-0.8.0

jobs:
  dockerfile-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/postgres-pgvector/Dockerfile

  build-push:
    needs: [dockerfile-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres-pgvector
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=db-image
          cache-to: type=gha,mode=max,scope=db-image

      # Proves the extension actually loads, not just that the build finished.
      - name: Smoke test pgvector
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci "${IMAGE}:${TAG}"
          for _ in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          docker exec pg psql -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION vector; SELECT '[1,0]'::vector <=> '[0,1]'::vector AS distance;"
          docker rm -f pg

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres-pgvector
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=db-image
          cache-to: type=gha,mode=max,scope=db-image
