name: Deploy to k3s

# Runs on the homelab self-hosted runner, which sits inside the LAN and talks to
# the k3s API directly — nothing has to be exposed on the home network, and the
# cluster's 6443 stays closed to the internet.
#
# Auto-deploy fires after the CI workflow finishes building and pushing images
# for a push to main. workflow_dispatch is the manual path, including rollback to
# an earlier image tag.
#
# Never add a `pull_request` trigger. Self-hosted runners execute whatever the
# workflow says, so a fork could otherwise run arbitrary code on the homelab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Short image SHA to deploy / roll back to. Blank = the triggering commit."
        required: false

# Deploys queue instead of cancelling: a cancelled run could leave migrations
# half-applied.
concurrency:
  group: deploy-k3s
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires for every CI conclusion; only deploy when CI passed.
    # workflow_dispatch is always allowed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, vnutour]
    environment: production
    env:
      # Runner is on the cp node; k3s wrote this kubeconfig world-readable
      # (--write-kubeconfig-mode=644). If the runner ever moves off cp, point
      # this at a copied kubeconfig whose server URL is the cp IP.
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      NS: vnutour
      OWNER: hunndayne

    steps:
      - name: Resolve commit and image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            ref="${{ github.event.workflow_run.head_sha }}"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "tag=${ref:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # Only needed for the migrate-job manifest; checkout the exact commit being
      # deployed so migrations match the image.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      # migrate + seed_phases, pinned to the image being deployed. Idempotent and
      # gated: nothing rolls out if this fails.
      - name: Migrate
        run: |
          T="${{ steps.meta.outputs.tag }}"
          kubectl -n "$NS" delete job vnutour-migrate --ignore-not-found
          sed "s#\(image: ghcr.io/$OWNER/vnutour-backend:\).*#\1$T#" k8s/05.migrate-job.yaml \
            | kubectl apply -f -
          kubectl -n "$NS" wait --for=condition=complete job/vnutour-migrate --timeout=300s

      - name: Roll out images
        run: |
          T="${{ steps.meta.outputs.tag }}"
          B="ghcr.io/$OWNER/vnutour-backend:$T"
          F="ghcr.io/$OWNER/vnutour-frontend:$T"
          kubectl -n "$NS" set image deploy/backend backend="$B"
          kubectl -n "$NS" set image deploy/bot bot="$B"
          kubectl -n "$NS" set image deploy/email-worker email-worker="$B"
          kubectl -n "$NS" set image deploy/frontend frontend="$F"
          # Only wait on the probe-backed, user-facing deployments. The bot has no
          # readiness probe and CrashLoops until DISCORD_TOKEN is set, so waiting
          # on it would fail every deploy for an unrelated reason.
          kubectl -n "$NS" rollout status deploy/backend --timeout=180s
          kubectl -n "$NS" rollout status deploy/frontend --timeout=180s

      - name: Verify
        run: kubectl -n "$NS" exec deploy/frontend -c frontend -- wget -qO- http://127.0.0.1/healthz

      - name: Report failure
        if: failure()
        run: |
          echo "::error::k3s deploy failed. Roll back via 'Run workflow' with a previous image_tag."
          kubectl -n "$NS" get pods -o wide
