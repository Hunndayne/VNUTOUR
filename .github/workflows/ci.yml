name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # settings_test swaps in an in-memory SQLite database, so no service
      # container is needed here.
      - name: Run tests
        working-directory: backend
        run: python -m pytest webapi/api/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Catches compile errors that lint alone lets through.
      - name: Build
        working-directory: frontend
        run: npm run build

  # Build and push the container images to GHCR, but only after tests and lint
  # are green and only on a push to a deploy branch — main or staging. Pull
  # requests still run the checks above without publishing anything. Uses the
  # built-in GITHUB_TOKEN, so no PAT is stored. Images are tagged with the short
  # commit SHA (immutable, what the deploy references) plus a rolling tag per
  # branch: latest tracks main, staging tracks the staging branch.
  build-push:
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA and rolling tag
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "rolling=staging" >> "$GITHUB_OUTPUT"
          else
            echo "rolling=latest" >> "$GITHUB_OUTPUT"
          fi

      # VITE_GOOGLE_CLIENT_ID is a build-time value baked into the frontend
      # bundle; set it as a repository variable. It is harmlessly ignored by the
      # backend build (Docker just warns the arg is unused).
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/hunndayne/vnutour-${{ matrix.name }}:${{ steps.meta.outputs.sha }}
            ghcr.io/hunndayne/vnutour-${{ matrix.name }}:${{ steps.meta.outputs.rolling }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
