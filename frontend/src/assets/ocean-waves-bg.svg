<svg viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Define gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E6F7FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B3E5FC;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#39D5F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B6F1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00B6F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1478D4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waveGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#18C2A3;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0A9E7D;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filter for soft shadows -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Sky Background -->
  <rect width="1440" height="1024" fill="url(#skyGradient)"/>
  
  <!-- Optional subtle sun -->
  <circle cx="1200" cy="120" r="65" fill="#FFD54D" opacity="0.25"/>
  <circle cx="1200" cy="120" r="50" fill="#FFD54D" opacity="0.35"/>
  
  <!-- Optional subtle clouds -->
  <g opacity="0.3">
    <ellipse cx="200" cy="140" rx="80" ry="40" fill="#FFFFFF"/>
    <ellipse cx="250" cy="150" rx="70" ry="35" fill="#FFFFFF"/>
    <ellipse cx="140" cy="150" rx="60" ry="30" fill="#FFFFFF"/>
  </g>
  
  <g opacity="0.25">
    <ellipse cx="1100" cy="200" rx="90" ry="45" fill="#FFFFFF"/>
    <ellipse cx="1160" cy="210" rx="75" ry="38" fill="#FFFFFF"/>
    <ellipse cx="1030" cy="210" rx="70" ry="35" fill="#FFFFFF"/>
  </g>
  
  <!-- Wave Layer 1 - Foreground (Brightest, Cyan) -->
  <path d="M 0,700 Q 90,680 180,690 T 360,690 T 540,685 T 720,690 T 900,685 T 1080,690 T 1260,685 T 1440,690 L 1440,1024 L 0,1024 Z" 
        fill="url(#waveGradient1)" filter="url(#softShadow)"/>
  
  <!-- Wave highlights - Layer 1 -->
  <path d="M 0,700 Q 90,680 180,690 T 360,690 T 540,685 T 720,690 T 900,685 T 1080,690 T 1260,685 T 1440,690" 
        stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.4"/>
  
  <!-- Wave Layer 2 - Mid-ground (Medium, Ocean Blue) -->
  <path d="M 0,600 Q 80,570 160,590 T 320,590 T 480,580 T 640,595 T 800,580 T 960,595 T 1120,580 T 1280,595 T 1440,580 L 1440,1024 L 0,1024 Z" 
        fill="url(#waveGradient2)" opacity="0.85" filter="url(#softShadow)"/>
  
  <!-- Wave detail lines - Layer 2 -->
  <path d="M 0,600 Q 80,570 160,590 T 320,590 T 480,580 T 640,595 T 800,580 T 960,595 T 1120,580 T 1280,595 T 1440,580" 
        stroke="#39D5F4" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Wave Layer 3 - Background (Deepest, Teal) -->
  <path d="M 0,520 Q 100,490 200,520 T 400,520 T 600,500 T 800,530 T 1000,500 T 1200,530 T 1440,500 L 1440,1024 L 0,1024 Z" 
        fill="url(#waveGradient3)" opacity="0.7" filter="url(#softShadow)"/>
  
  <!-- Wave detail lines - Layer 3 -->
  <path d="M 0,520 Q 100,490 200,520 T 400,520 T 600,500 T 800,530 T 1000,500 T 1200,530 T 1440,500" 
        stroke="#18C2A3" stroke-width="2" fill="none" opacity="0.25"/>
  
  <!-- Accent wave elements with warm colors (subtle) -->
  <g opacity="0.15">
    <!-- Subtle orange accent wave lines -->
    <path d="M 0,750 Q 120,730 240,750 T 480,750 T 720,740 T 960,750 T 1200,740 T 1440,750" 
          stroke="#FF8A00" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Additional layer for wave movement effect -->
  <path d="M 0,650 Q 110,620 220,650 T 440,650 T 660,630 T 880,660 T 1100,630 T 1320,660 T 1440,630 L 1440,720 Q 110,700 220,720 T 440,720 T 660,700 T 880,730 T 1100,700 T 1320,730 T 1440,700 Z" 
        fill="#39D5F4" opacity="0.2" filter="url(#softShadow)"/>
  
  <!-- Highlight strips for wave movement -->
  <g opacity="0.25">
    <ellipse cx="250" cy="710" rx="100" ry="30" fill="#FFFFFF"/>
    <ellipse cx="650" cy="735" rx="120" ry="28" fill="#FFFFFF"/>
    <ellipse cx="1050" cy="720" rx="110" ry="32" fill="#FFFFFF"/>
    <ellipse cx="1350" cy="730" rx="95" ry="30" fill="#FFFFFF"/>
  </g>
</svg>